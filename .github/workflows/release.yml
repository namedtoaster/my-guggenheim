name: Release

# Push a tag like v0.1.0 to publish the claude.ai skill zip as a release download.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python scripts/validate.py --quick
      - run: python scripts/package_skill.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/my-guggenheim-exhibit.zip
          generate_release_notes: true
